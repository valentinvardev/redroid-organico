name: redroid-organico

services:
  postgres:
    image: postgres:16-alpine
    # Vuelve solo tras un reboot del host / stop-start de EC2. Sin esto el
    # datastore queda abajo y la app falla toda query contra 127.0.0.1:5433.
    restart: unless-stopped
    environment:
      POSTGRES_USER: redroid
      POSTGRES_PASSWORD: redroid
      POSTGRES_DB: redroid
    # 5433 on the host to avoid colliding with a native PostgreSQL install on
    # 5432. Containers still reach it as postgres:5432 over the compose network.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redroid -d redroid"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly keeps delayed/scheduled jobs across a restart; without it a
    # container bounce silently drops everything not yet picked up.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: runtime
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://redroid:redroid@postgres:5432/redroid?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Behind a profile so a bare `docker compose up` cannot start a second copy of
  # the app. Running these in containers while another copy runs on the host —
  # under systemd, say — gives two workers competing for one queue with
  # different configuration: this one resolves STORAGE_LOCAL_DIR to /app/.storage
  # and cannot see media the host wrote, so whether a job works depends on which
  # worker happened to pick it up.
  #
  #   docker compose --profile app up --build       everything in containers
  #   docker compose --profile android up ...       datastores + device stack only
  web:
    profiles: ["app"]
    build:
      context: .
      target: runtime
    command: ["npm", "run", "start"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://redroid:redroid@postgres:5432/redroid?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /app/.storage
    ports:
      - "3000:3000"
    volumes:
      - media:/app/.storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    profiles: ["app"]
    build:
      context: .
      target: runtime
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://redroid:redroid@postgres:5432/redroid?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /app/.storage
    # The worker reads media the web container wrote, so both mount the same
    # volume. Moving STORAGE_DRIVER to s3 removes this coupling.
    volumes:
      - media:/app/.storage
      # Required only by PUBLISHER_DRIVER=android: the worker creates and
      # destroys ReDroid containers through the host daemon. This grants the
      # worker root-equivalent access to the host — acceptable for the MVP,
      # not for a shared or untrusted environment.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - redroid
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Give in-flight jobs room to finish on `docker compose down` rather than
    # being SIGKILLed into a stuck PROCESSING row.
    stop_grace_period: 60s

  # ---------------------------------------------------------------------------
  # Android automation. Started with `docker compose --profile android up`, so a
  # deployment using the stub driver does not pay for any of it.
  #
  # ReDroid containers are NOT declared here: the worker creates one per job and
  # destroys it afterwards. They join the `redroid` network below, which is why
  # the account's redroid config should use connectVia: "container-name".
  # ---------------------------------------------------------------------------

  # One adb server shared by the worker and Appium. Without this each side would
  # run its own, and a device connected by the worker would be invisible to
  # Appium. `-a` makes it listen on all interfaces instead of loopback only.
  adb-server:
    profiles: ["android"]
    restart: unless-stopped
    build:
      context: .
      target: runtime
    command: ["adb", "-a", "-P", "5037", "nodaemon", "server"]
    ports:
      # Bound to loopback deliberately. An adb server reachable from the
      # internet is remote code execution on every device attached to it, and
      # `-a` already makes it listen on all interfaces inside the container.
      # Only needed when the worker runs on the host rather than in compose.
      - "127.0.0.1:5037:5037"
      # Ports of the services that share this container's network namespace.
      # Everything that reaches a device through `adb forward` has to live in
      # this namespace — see the note on ws-scrcpy.
      - "8000:8000"
      - "4723:4723"
    networks:
      - redroid
      # Where it actually reaches proxied devices. A gateway container joins
      # this one too, and its subnet is the only destination the device's egress
      # ACL leaves open — see lib/android/egressPolicy.ts.
      - redroid-control
    healthcheck:
      test: ["CMD", "adb", "-P", "5037", "version"]
      interval: 10s
      timeout: 5s
      retries: 5

  appium:
    profiles: ["android"]
    restart: unless-stopped
    # Built rather than pulled: the published appium/appium tags are amd64-only,
    # which on an ARM host means qemu emulation for the server and its adb.
    build:
      context: .
      dockerfile: Dockerfile.appium
    environment:
      # Loopback, because this shares the adb server's network namespace.
      ANDROID_ADB_SERVER_ADDRESS: 127.0.0.1
      ANDROID_ADB_SERVER_HOST: 127.0.0.1
      ANDROID_ADB_SERVER_PORT: "5037"
    # Same requirement as ws-scrcpy: the UiAutomator2 driver reaches its
    # on-device server through `adb forward`, and that listener opens on the
    # machine running the adb server. Split namespaces would leave Appium
    # dialling an empty loopback.
    #
    # Port 4723 is published on adb-server.
    network_mode: "service:adb-server"
    depends_on:
      adb-server:
        condition: service_healthy

  # The screen the operator actually sees, embedded in the dashboard's iframe.
  #
  # It talks to the same adb server as Appium and the worker, which is the whole
  # reason that server exists: the device the worker attaches with `adb connect`
  # has to show up in the viewer's device list without anyone connecting it
  # twice. A viewer running its own adb server would see nothing.
  ws-scrcpy:
    profiles: ["android"]
    # Built from source: NetrisTV publishes no official image.
    build:
      context: .
      dockerfile: Dockerfile.ws-scrcpy
    environment:
      ADB_HOST: 127.0.0.1
      ADB_PORT: "5037"
      ANDROID_ADB_SERVER_ADDRESS: 127.0.0.1
      ANDROID_ADB_SERVER_PORT: "5037"
    # Shares the adb server's network namespace, which is not a shortcut but a
    # requirement: to stream, ws-scrcpy asks adb to forward a local port to the
    # device, and `adb forward` opens that listener on whichever machine runs
    # the adb *server*. With separate namespaces the port opens inside
    # adb-server while ws-scrcpy dials its own empty loopback and gets
    # ECONNREFUSED on 127.0.0.1:8001 — a viewer that loads, connects, and shows
    # grey. Sharing the namespace makes both sides mean the same 127.0.0.1.
    #
    # Consequence: this service declares no ports or networks of its own; port
    # 8000 is published on adb-server above.
    network_mode: "service:adb-server"
    depends_on:
      adb-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media:

networks:
  default:
  # Named explicitly so the worker can pass it to `docker run --network` when it
  # creates a ReDroid container. An implicit compose network name would depend
  # on the project directory.
  #
  # This is also the network a proxy gateway reaches its proxy over, so it has
  # to keep its route off the host.
  redroid:
    name: redroid-net

  # ADB only, and deliberately unable to reach anything else.
  #
  # A device pinned to a proxy has one hole in its egress firewall: the subnet
  # its control plane lives on, because the ADB connection has to keep working.
  # `internal` makes that hole lead nowhere — Docker gives this bridge no route
  # off the host — so a mistake in that one rule cannot turn into an exit. The
  # enforcement sits outside the namespace, where Android cannot reach it even
  # though its container is privileged.
  redroid-control:
    name: redroid-control-net
    internal: true
